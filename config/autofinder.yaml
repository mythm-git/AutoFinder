scheduler:
  interval_minutes: 45

search:
  marketplace: "kleinanzeigen"
  postal_code: "27449"
  radius_km: 50
  search_url: "https://www.kleinanzeigen.de/s-autos/27449/sortierung:neuste/preis:50:3000/c216l2709r50+autos.km_i:0%2C200000+autos.power_i:65%2C200+autos.schaden_s:nein"

collection:
  listings_per_run: 5

apify:
  actor_id: "rKEiEgI8vfyKcaBUj"
  timeout_seconds: 120

deduplication:
  state_file: "data/state/seen_listings.json"

filters:
  price:
    min_eur: 50
    max_eur: 3000
  mileage:
    min_km: 0
    max_km: 200000
  power:
    min_ps: 65
    max_ps: 200
  reject_dealers: true
  dealer_text_indicators:
    - "finanzierung ohne anzahlung"
    - "inzahlungnahme"
    - "autohaus"
    - "kfz-handel"
    - "weitere fahrzeuge"
    - "verkaufsteam"

telegram:
  runtime_summary_enabled: true
  candidate_alerts_enabled: true
  max_list_items: 4

deal_evaluation:
  minimum_expected_roi_percent: 20.0
  minimum_conservative_roi_for_strong_percent: 0.0
  minimum_analysis_confidence: 0.60
  minimum_repair_confidence: 0.55
  minimum_valuation_confidence: 0.60
  maximum_risk_for_strong: "medium"
  reject_very_high_risk: true

daily_reporting:
  enabled: true
  timezone: "Europe/Berlin"
  report_time: "00:10"
  report_directory: "reports/daily"
  audit_directory: "data/audit"
  state_file: "data/report_state/daily_reports.json"
  send_to_telegram: true
  include_basic_filter_rejections: true

ai:
  primary_provider: "groq"
  fallback_provider: "gemini"
  timeout_seconds: 60
  max_retries_per_provider: 1
  groq:
    model: "openai/gpt-oss-120b"
  gemini:
    model: "gemini-3.8-flash"
