[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "autofinder"
version = "2.0.0"
description = "Local-first used-car opportunity finder foundation"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "PyYAML>=6.0,<7.0",
  "python-dotenv>=1.0,<2.0",
  "pydantic>=2.13,<3.0",
  "groq>=1.7,<2.0",
  "google-genai>=2.27,<3.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0,<9.0"]

[project.scripts]
autofinder = "autofinder.main:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"

[tool.setuptools.packages.find]
where = ["src"]
